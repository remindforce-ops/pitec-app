<header class="topbar">

      <a href="#/new" class="btn primary" data-nav="new">+ 새 기록</a>

<div class="layout">
  <aside id="side"></aside>

<nav class="bottomnav" id="bottomnav">

  <a href="#/sites" data-nav="sites"><span class="ic">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 21V5l8-3v19M12 8l8 3v10M3 21h18M7 8h2M7 12h2M7 16h2M15 14h2M15 18h2"/></svg></span>현장</a>

  <a href="#/me" data-nav="me"><span class="ic">

</div>

  <div class="box">
    <div class="login-logo"><b>파이텍</b> 기록</div>
    <p id="loginMsg" class="muted"></p>
    <div id="gbtn" class="gbtn"></div>
  </div>
</div>

<div id="lightbox" class="overlay" hidden>
  <img alt="">
  <div class="lb-actions"><a id="lbOpen" class="btn" target="_blank" rel="noopener">원본 열기</a><button class="btn" id="lbClose">닫기</button></div>
