<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>갤러리 열기 시험</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --line: #dfe4ea; --text: #1d2329; --muted: #66707b;
    --accent: #185fa5; --ok-bg: #e1f5ee; --ok: #0f6e56;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14181c; --card: #1d2228; --line: #2e353d; --text: #e8ecf0; --muted: #9aa4ae; --accent: #6aa8e8; --ok-bg: #12352b; --ok: #7fd8b6; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #14181c; --card: #1d2228; --line: #2e353d; --text: #e8ecf0; --muted: #9aa4ae; --accent: #6aa8e8; --ok-bg: #12352b; --ok: #7fd8b6; color-scheme: dark; }
  body { background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 20px; margin: 0; text-wrap: balance; }
  p.lead { margin: 0; color: var(--muted); font-size: 15px; }
  .opt { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .opt .badge { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; }
  .opt .txt { flex: 1; min-width: 0; }
  .opt .txt b { display: block; }
  .opt .txt span { color: var(--muted); font-size: 13px; }
  .opt label { flex: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 9px 14px; font-weight: 600; cursor: pointer; }
  .opt label:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  .res { margin-top: 4px; font-size: 13px; color: var(--ok); background: var(--ok-bg); border-radius: 6px; padding: 2px 8px; display: inline-block; }
body{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>갤러리 열기 시험</h1>
  <p class="lead">휴대폰에서 A부터 E까지 하나씩 눌러 보세요. <b>갤러리</b>가 뜨거나 사진 목록이 바로 나오는 글자를 알려주시면 그 방식으로 앱을 고치겠습니다. 고른 사진은 어디에도 올라가지 않습니다. 확인이 끝나면 이 페이지는 지웁니다.</p>

  <div class="opt"><div class="badge">A</div><div class="txt"><b>한 장씩 고르기</b><span>사진 형식 전체, 1장</span><div class="res" id="rA" hidden></div></div>
    <label>열기<input id="iA" type="file" accept="image/*" hidden></label></div>

  <div class="opt"><div class="badge">B</div><div class="txt"><b>여러 장 고르기 (지금 방식)</b><span>사진 형식 전체, 여러 장</span><div class="res" id="rB" hidden></div></div>
    <label>열기<input id="iB" type="file" accept="image/*" multiple hidden></label></div>

  <div class="opt"><div class="badge">C</div><div class="txt"><b>사진 형식 지정, 여러 장</b><span>JPG·PNG·HEIC 등</span><div class="res" id="rC" hidden></div></div>
    <label>열기<input id="iC" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple hidden></label></div>

  <div class="opt"><div class="badge">D</div><div class="txt"><b>사진 형식 지정, 한 장</b><span>JPG·PNG·HEIC 등</span><div class="res" id="rD" hidden></div></div>
    <label>열기<input id="iD" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" hidden></label></div>

  <div class="opt"><div class="badge">E</div><div class="txt"><b>형식 제한 없음, 여러 장</b><span>모든 파일</span><div class="res" id="rE" hidden></div></div>
    <label>열기<input id="iE" type="file" multiple hidden></label></div>
</div>
<script>
  ['A', 'B', 'C', 'D', 'E'].forEach(function (k) {
    document.getElementById('i' + k).addEventListener('change', function (e) {
      var n = (e.target.files || []).length;
      var r = document.getElementById('r' + k);
      r.textContent = n ? '사진 ' + n + '장 선택됨' : '선택 안 함';
      r.hidden = false;
      e.target.value = '';
    });
  });
</script>

</body>
</html>
